<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persistent MP4 Player</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f0f11;
      color: #e4e4e7;
    }

    #setup-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .field-group {
      width: 100%;
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: #a1a1aa;
    }

    input[type="file"] {
      width: 100%;
      font-size: 0.85rem;
      color: #a1a1aa;
      background-color: #0f0f11;
      border: 1px solid #27272a;
      border-radius: 6px;
      padding: 0.5rem;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      background-color: #27272a;
      color: #e4e4e7;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      margin-right: 0.75rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    input[type="file"]::file-selector-button:hover {
      background-color: #3f3f46;
    }

    #load-btn {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.75rem;
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    #load-btn:hover {
      background-color: #2563eb;
    }

    #load-btn:active {
      transform: scale(0.98);
    }

    #player-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }

    #video-player {
      width: 100vw;
      height: calc(100vh - 5vh);
      margin-bottom: 5vh;
      object-fit: contain;
      outline: none;
    }

    #clear-btn {
      position: absolute;
      top: 1.5vh;
      right: 1.5vw;
      z-index: 10;
      background: rgba(24, 24, 27, 0.75);
      color: #a1a1aa;
      border: 1px solid rgba(63, 63, 70, 0.5);
      backdrop-filter: blur(8px);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #clear-btn:hover {
      background: rgba(239, 68, 68, 0.85);
      color: #ffffff;
      border-color: transparent;
    }
  </style>
</head>
<body>

  <!-- Main Setup Page -->
  <div id="setup-page">
    <div class="field-group">
      <label for="video-input">MP4 File</label>
      <input type="file" id="video-input" accept="video/mp4">
    </div>

    <div class="field-group">
      <label for="vtt-input">VTT Subtitles (Optional)</label>
      <input type="file" id="vtt-input" accept=".vtt">
    </div>

    <button id="load-btn">Load Player</button>
  </div>

  <!-- Player Page -->
  <div id="player-container" style="display: none;">
    <button id="clear-btn" title="Clear player & data">✕</button>
    <video id="video-player" controls></video>
  </div>

  <script>
    const setupPage = document.getElementById('setup-page');
    const playerContainer = document.getElementById('player-container');
    const videoPlayer = document.getElementById('video-player');
    const videoInput = document.getElementById('video-input');
    const vttInput = document.getElementById('vtt-input');
    const loadBtn = document.getElementById('load-btn');
    const clearBtn = document.getElementById('clear-btn');

    const DB_NAME = 'MediaStorageDB';
    const STORE_NAME = 'media';

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function saveData(key, data) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(data, key);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
      });
    }

    async function getData(key) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function clearAllData() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.clear();
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e.target.error);
      });
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    videoPlayer.addEventListener('timeupdate', () => {
      if (videoPlayer.currentTime > 0) {
        localStorage.setItem('saved_timestamp', videoPlayer.currentTime);
      }
    });

    loadBtn.addEventListener('click', async () => {
      const videoFile = videoInput.files[0];
      const vttFile = vttInput.files[0];

      const savedVideo = await getData('video_blob');

      if (!videoFile && !savedVideo) {
        alert('Please select an MP4 file.');
        return;
      }

      if (videoFile) {
        await saveData('video_blob', videoFile);
      }

      if (vttFile) {
        await saveData('vtt_blob', vttFile);
      }

      initPlayer();
    });

    async function initPlayer() {
      try {
        const videoBlob = await getData('video_blob');
        if (!videoBlob) return;

        const videoUrl = URL.createObjectURL(videoBlob);
        videoPlayer.src = videoUrl;

        Array.from(videoPlayer.querySelectorAll('track')).forEach(t => t.remove());

        const vttBlob = await getData('vtt_blob');
        if (vttBlob) {
          const vttDataUrl = await fileToDataURL(vttBlob);
          const track = document.createElement('track');
          track.kind = 'subtitles';
          track.label = 'Subtitles';
          track.srclang = 'en';
          track.src = vttDataUrl;
          track.default = true;
          videoPlayer.appendChild(track);
        }

        videoPlayer.onloadedmetadata = () => {
          const savedTime = localStorage.getItem('saved_timestamp');
          if (savedTime) {
            videoPlayer.currentTime = parseFloat(savedTime);
          }
        };

        setupPage.style.display = 'none';
        playerContainer.style.display = 'flex';
      } catch (err) {
        console.error("Error loading video:", err);
        alert("Failed to load video file.");
      }
    }

    clearBtn.addEventListener('click', async () => {
      videoPlayer.pause();
      videoPlayer.removeAttribute('src');
      videoPlayer.load();
      localStorage.removeItem('saved_timestamp');
      await clearAllData();

      playerContainer.style.display = 'none';
      setupPage.style.display = 'flex';
      videoInput.value = '';
      vttInput.value = '';
    });

    window.addEventListener('DOMContentLoaded', async () => {
      const savedVideo = await getData('video_blob');
      if (savedVideo) {
        initPlayer();
      }
    });
  </script>
</body>
</html>
