<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist MP4 Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom monochrome and border styling */
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    .border-minimal {
      border: 1px solid #333333;
    }

    .border-minimal-bright {
      border: 1px solid #ffffff;
    }

    /* Video player container styling */
    video {
      max-width: 100vw;
      max-height: calc(100vh - 5vh);
      object-fit: contain;
      background-color: #000000;
      margin-bottom: 5vh;
    }

    /* Style subtitle cues for clean high contrast */
    ::cue {
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      font-family: sans-serif;
    }

    /* Custom scrollbar for minimalism */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #333333;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center m-0 p-0 overflow-hidden select-none">

  <!-- ==================== UPLOAD VIEW ==================== -->
  <div id="uploadView" class="w-full max-w-md p-6 sm:p-8 flex flex-col justify-center items-stretch space-y-6">
    <!-- Header -->
    <div class="text-center space-y-1">
      <h1 class="text-xl font-light tracking-widest uppercase">Media Player</h1>
      <p class="text-xs text-gray-500 tracking-wider">Minimalist • Self-Hosted Cache</p>
    </div>

    <form id="uploadForm" class="space-y-5" onsubmit="event.preventDefault(); loadVideo();">
      <!-- MP4 File Input -->
      <div class="space-y-2">
        <label for="videoInput" class="block text-xs uppercase tracking-wider text-gray-400">
          MP4 Video File <span class="text-white">*</span>
        </label>
        <label class="flex flex-col items-center justify-center w-full h-24 border-minimal hover:border-minimal-bright transition-colors duration-200 cursor-pointer rounded-none bg-black">
          <span id="videoFileName" class="text-xs text-gray-400 px-4 text-center truncate w-full">Select MP4 file</span>
          <input id="videoInput" type="file" accept="video/mp4,video/*" class="hidden" required onchange="updateFileName('videoInput', 'videoFileName')" />
        </label>
      </div>

      <!-- VTT Subtitle Input -->
      <div class="space-y-2">
        <label for="vttInput" class="block text-xs uppercase tracking-wider text-gray-400">
          VTT Subtitle File <span class="text-gray-600">(Optional)</span>
        </label>
        <label class="flex flex-col items-center justify-center w-full h-20 border-minimal hover:border-minimal-bright transition-colors duration-200 cursor-pointer rounded-none bg-black">
          <span id="vttFileName" class="text-xs text-gray-400 px-4 text-center truncate w-full">Select VTT file</span>
          <input id="vttInput" type="file" accept=".vtt,text/vtt" class="hidden" onchange="updateFileName('vttInput', 'vttFileName')" />
        </label>
      </div>

      <!-- Action Button -->
      <button type="submit" class="w-full py-3 mt-4 border-minimal-bright bg-black text-white text-xs uppercase tracking-widest hover:bg-white hover:text-black transition-colors duration-200">
        Load Player
      </button>
    </form>
  </div>

  <!-- ==================== PLAYER VIEW ==================== -->
  <div id="playerView" class="fixed inset-0 w-screen h-screen bg-black hidden flex items-center justify-center z-50">
    <!-- Top-Right Close / Reset Button -->
    <button id="closeBtn" onclick="clearAndReset()" title="Close & Clear" class="fixed top-4 right-4 z-50 p-2 text-white bg-black/50 hover:bg-white hover:text-black border-minimal-bright transition-colors duration-200 focus:outline-none">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>

    <!-- HTML5 Video Element -->
    <video id="mainVideo" controls class="w-full h-full">
      <track id="vttTrack" kind="subtitles" srclang="en" label="Subtitles" default hidden>
      Your browser does not support HTML5 video.
    </video>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // State references
    let currentVideoObjectUrl = null;
    let currentVttObjectUrl = null;
    let currentCacheKey = null;

    const uploadView = document.getElementById('uploadView');
    const playerView = document.getElementById('playerView');
    const videoInput = document.getElementById('videoInput');
    const vttInput = document.getElementById('vttInput');
    const mainVideo = document.getElementById('mainVideo');
    const vttTrack = document.getElementById('vttTrack');

    // Helper: Update file name label in upload UI
    function updateFileName(inputId, labelId) {
      const input = document.getElementById(inputId);
      const label = document.getElementById(labelId);
      if (input.files && input.files.length > 0) {
        label.textContent = input.files[0].name;
        label.classList.remove('text-gray-400');
        label.classList.add('text-white');
      } else {
        label.textContent = inputId === 'videoInput' ? 'Select MP4 file' : 'Select VTT file';
        label.classList.add('text-gray-400');
        label.classList.remove('text-white');
      }
    }

    // Generate unique signature for video caching based on file metadata
    function generateFileKey(file) {
      return `mp4_cache_${file.name}_${file.size}_${file.lastModified}`;
    }

    // Main loader trigger
    function loadVideo() {
      const videoFile = videoInput.files[0];
      const vttFile = vttInput.files[0];

      if (!videoFile) return;

      // Clean up previous Object URLs
      revokeObjectURLs();

      // Create new Object URLs
      currentVideoObjectUrl = URL.createObjectURL(videoFile);
      mainVideo.src = currentVideoObjectUrl;

      // Handle optional VTT track
      if (vttFile) {
        currentVttObjectUrl = URL.createObjectURL(vttFile);
        vttTrack.src = currentVttObjectUrl;
        vttTrack.hidden = false;
      } else {
        vttTrack.src = '';
        vttTrack.hidden = true;
      }

      // Unique cache identifier
      currentCacheKey = generateFileKey(videoFile);

      // Restore playback timestamp if available
      const savedTime = localStorage.getItem(currentCacheKey);
      if (savedTime) {
        mainVideo.currentTime = parseFloat(savedTime);
      }

      // Switch views
      uploadView.classList.add('hidden');
      playerView.classList.remove('hidden');

      // Add state persistence listeners
      mainVideo.addEventListener('timeupdate', saveTimestamp);
      mainVideo.addEventListener('pause', saveTimestamp);
      window.addEventListener('beforeunload', saveTimestamp);
    }

    // Save current video playback time into localStorage
    function saveTimestamp() {
      if (currentCacheKey && mainVideo.currentTime > 0) {
        localStorage.setItem(currentCacheKey, mainVideo.currentTime.toString());
      }
    }

    // Revoke memory allocations for blobs
    function revokeObjectURLs() {
      if (currentVideoObjectUrl) {
        URL.revokeObjectURL(currentVideoObjectUrl);
        currentVideoObjectUrl = null;
      }
      if (currentVttObjectUrl) {
        URL.revokeObjectURL(currentVttObjectUrl);
        currentVttObjectUrl = null;
      }
    }

    // Reset everything, remove stored time, and back to initial view
    function clearAndReset() {
      // Pause playback
      mainVideo.pause();

      // Remove listeners
      mainVideo.removeEventListener('timeupdate', saveTimestamp);
      mainVideo.removeEventListener('pause', saveTimestamp);
      window.removeEventListener('beforeunload', saveTimestamp);

      // Clear storage for current file
      if (currentCacheKey) {
        localStorage.removeItem(currentCacheKey);
        currentCacheKey = null;
      }

      // Reset video element
      mainVideo.removeAttribute('src');
      mainVideo.load();
      vttTrack.src = '';

      // Clear Blob URLs from memory
      revokeObjectURLs();

      // Reset file inputs
      document.getElementById('uploadForm').reset();
      updateFileName('videoInput', 'videoFileName');
      updateFileName('vttInput', 'vttFileName');

      // Switch back to upload screen
      playerView.classList.add('hidden');
      uploadView.classList.remove('hidden');
    }
  </script>
</body>
</html>
